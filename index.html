<script>window.D={"posts":[{"slug":"metodo-80-20-fitness","title":"Método 80/20 fitness: resultados reales con coaching online fitness","description":"Descubre el Método 80/20 fitness: cómo perder grasa sin restricciones, entrenar fuerza y lograr fitness sostenible con coaching online fitness.","date":"2026-09-28","readingTime":"7 min","cover":{"src":"/images/coach-cocina.png","alt":"Coach de FranFit explicando el método 80/20 fitness en su cocina, coaching online fitness"},"keywords":["Coaching online fitness","Método 80/20 fitness","trabaja con tu cuerpo","preparador físico online","fitness sostenible","perder grasa sin restricciones"],"blocks":[{"t":"p","c":"Si has probado dietas estrictas, retos de 30 días y rutinas imposibles de sostener, seguramente conoces la sensación: empiezas motivada, aguantas unas semanas y terminas sintiendo que fallaste. La verdad es que el problema casi nunca eres tú, sino el método. En este artículo te explico el Método 80/20 fitness, la base de mi coaching online fitness, y cómo puedes aplicarlo desde hoy para mejorar tu físico, tu energía y tu relación con la comida sin vivir en modo castigo."},{"t":"h2","c":"¿Qué es el Método 80/20 fitness?"},{"t":"p","c":"El Método 80/20 fitness es un enfoque de vida, no una dieta ni un plan temporal. Se basa en una idea sencilla: si el 80 % del tiempo tomas decisiones que apoyan tu salud (comer bien, entrenar fuerza, dormir y moverte), el otro 20 % puede ser flexible, disfrutable y sin culpa. Ese margen no es una trampa ni un premio por portarte bien; es lo que hace que el sistema funcione a largo plazo."},{"t":"p","c":"Lo llamo «80/20 living» porque va más allá del gimnasio. Se trata de construir una rutina que encaje con tu trabajo, tu familia, tus viajes y tus ganas de disfrutar una cena con amigos. Cuando el plan cabe en tu vida real, dejas de abandonarlo."},{"t":"h3","c":"El 80 %: la base constante"},{"t":"p","c":"Este porcentaje son los hábitos que mueven la aguja. Hablamos de comidas basadas en proteína, verduras, carbohidratos de calidad y grasas saludables; de entrenamientos de fuerza planificados; de caminar a diario; y de dormir lo suficiente. No necesitas que sea perfecto, necesitas que sea repetible. Un plato simple que puedes preparar cada semana vale más que una receta sofisticada que solo cocinas una vez."},{"t":"h3","c":"El 20 %: la flexibilidad que sostiene el proceso"},{"t":"p","c":"Aquí entran la pizza del viernes, el postre en un cumpleaños, el brunch del domingo o un día en que el entrenamiento no salió como esperabas. Cuando el 20 % está permitido, desaparece la mentalidad de todo o nada, que es responsable de la mayoría de los atracones y abandonos. Comes, disfrutas y vuelves a tu base en la siguiente comida, sin compensar ni castigarte."},{"t":"h2","c":"Por qué las dietas restrictivas fallan"},{"t":"p","c":"Las dietas extremas funcionan un tiempo porque generan un déficit muy agresivo, pero tienen tres problemas graves que casi nadie te cuenta al empezar:"},{"t":"ul","c":["Son difíciles de mantener: la fuerza de voluntad se agota y el hambre constante termina ganando.","Crean una relación tensa con la comida: alimentos «prohibidos», culpa y ciclos de restricción y exceso.","Suelen recuperarse los kilos: al no haber aprendido hábitos, el cuerpo vuelve al punto de partida, y a veces con más."]},{"t":"p","c":"El fitness sostenible parte de la lógica contraria: en lugar de pedirte que cambies todo de golpe, te propone pequeñas mejoras que puedas mantener durante meses y años. Los cambios más visibles suelen llegar precisamente cuando dejas de buscar atajos."},{"t":"h2","c":"Trabaja con tu cuerpo, no en su contra"},{"t":"p","c":"Esta frase resume mi filosofía. Cuando decides trabajar con tu cuerpo, respetas tu ciclo, tu nivel de estrés, tu descanso y tu historia. Entrenas para ser más fuerte, no para castigar lo que comiste. Comes para tener energía y rendir, no para «ganarte» un capricho. El cuerpo deja de ser un enemigo al que hay que corregir y pasa a ser tu aliado."},{"t":"img","src":"/images/entrenamiento-fuerza.png","alt":"Mujer haciendo entrenamiento de fuerza para espalda en máquina de gimnasio, fitness sostenible","cap":"El entrenamiento de fuerza es el centro del método: progresión, técnica y constancia."},{"t":"p","c":"Trabajar con tu cuerpo significa también ajustar el plan según la etapa que estés viviendo. Hay semanas de más energía y semanas en las que lo mejor es entrenar menos y descansar más. Un buen plan se adapta a ti, y no al revés."},{"t":"h2","c":"Perder grasa sin restricciones: cómo se hace"},{"t":"p","c":"Perder grasa sin restricciones no significa comer sin control; significa lograr un déficit moderado y consistente sin eliminar grupos de alimentos ni vivir contando cada caloría de por vida. Estos son los tres pilares que uso con mis clientes."},{"t":"h3","c":"1. Nutrición equilibrada y flexible"},{"t":"p","c":"Prioriza proteína en cada comida, suma verduras y fibra para saciarte, elige carbohidratos que te den energía para entrenar y no le tengas miedo a las grasas saludables. Usa el plato como guía visual en lugar de obsesionarte con los números. Con el tiempo, aprendes a estimar porciones y a decidir con criterio en restaurantes y reuniones."},{"t":"h3","c":"2. Entrenamiento de fuerza como prioridad"},{"t":"p","c":"El entrenamiento de fuerza construye y conserva músculo, mejora tu composición corporal y acelera tu progreso más que las horas de cardio interminables. Con tres o cuatro sesiones semanales bien planificadas, con progresión de cargas y buena técnica, notarás cambios en tu figura, tu postura y tu confianza. El cardio y las caminatas son un complemento, no el castigo por comer."},{"t":"h3","c":"3. Descanso, sueño y manejo del estrés"},{"t":"p","c":"Dormir mal aumenta el apetito y baja tu motivación; el estrés constante dificulta la recuperación. Cuidar tus horas de sueño, tus pausas y tus días de descanso también es parte del entrenamiento. Sin recuperación, el progreso se estanca."},{"t":"h2","c":"Cómo se ve una semana 80/20 en la práctica"},{"t":"p","c":"Un ejemplo de semana realista, adaptable a tu nivel:"},{"t":"ul","c":["Tres a cuatro entrenamientos de fuerza de 45 a 60 minutos.","Entre 7.000 y 10.000 pasos diarios como meta flexible.","Comidas con proteína y vegetales la mayoría de los días.","Una o dos comidas libres, sin pesar ni medir, disfrutadas al máximo.","Siete a ocho horas de sueño como objetivo y al menos un día de descanso completo."]},{"t":"p","c":"Si un día se complica, no pasa nada. Lo importante es la tendencia semanal, no la perfección diaria."},{"t":"h2","c":"Qué aporta un preparador físico online"},{"t":"p","c":"Un preparador físico online te da estructura, criterio y acompañamiento. En vez de improvisar con rutinas de redes sociales, recibes un plan hecho para tu objetivo, tu horario, tu equipamiento y tu nivel. Además, alguien revisa tu progreso, corrige tu técnica y ajusta el programa cuando la vida cambia. Lo más valioso suele ser la rendición de cuentas: saber que alguien te acompaña hace que los hábitos se mantengan."},{"t":"p","c":"Puedes ver [cómo funciona el programa](/#servicios) o conocer [mi historia](/#sobre-mi) para saber si conectamos."},{"t":"h2","c":"Coaching online fitness con FranFit: cómo funciona"},{"t":"p","c":"Mi coaching online fitness 1:1 está pensado para personas que quieren resultados sin sacrificar su vida social ni su salud mental. El proceso incluye:"},{"t":"ul","c":["Evaluación inicial de tu objetivo, tu nivel, tu rutina y tus preferencias de comida.","Plan de entrenamiento personalizado, con indicaciones claras de técnica.","Guía nutricional flexible basada en el enfoque 80/20, sin dietas rígidas.","Revisiones semanales para ajustar el plan según tu progreso.","Soporte directo por mensajes para resolver dudas en el momento."]},{"t":"p","c":"Si quieres trabajar conmigo, aplica desde el [formulario de esta web](/#aplicar) y revisaremos si soy la mejor opción para ti. Puedes seguir mi contenido diario en [Instagram](https://instagram.com/franfit.pe)."},{"t":"h2","c":"Errores comunes al empezar"},{"t":"ul","c":["Querer cambiarlo todo en una semana y abandonar al tercer día.","Eliminar alimentos que te gustan en lugar de darles un lugar razonable.","Compensar cada exceso con cardio extra o ayunos.","Compararte con el progreso ajeno en lugar de medir el tuyo.","Entrenar sin progresión, repitiendo siempre los mismos pesos."]},{"t":"p","c":"Evitar estos errores te ahorra meses de frustración. Recuerda: la constancia imperfecta le gana siempre a la perfección intermitente."},{"t":"h2","c":"Preguntas frecuentes"},{"t":"h3","c":"¿El Método 80/20 sirve si soy principiante?"},{"t":"p","c":"Sí. De hecho, es ideal para empezar porque no exige perfección. Comienzas con hábitos básicos y vas subiendo la exigencia a medida que ganas confianza y fuerza."},{"t":"h3","c":"¿Puedo perder grasa comiendo mis alimentos favoritos?"},{"t":"p","c":"Sí, siempre que la base de tu semana esté ordenada. Ningún alimento por sí solo engorda o adelgaza; lo que cuenta es el conjunto y la constancia."},{"t":"h3","c":"¿Necesito ir al gimnasio?"},{"t":"p","c":"Lo ideal es tener acceso a pesas o máquinas, pero un plan bien diseñado también puede hacerse en casa con mancuernas y bandas. Lo esencial es la progresión."},{"t":"h2","c":"Conclusión: el fitness sostenible sí es posible"},{"t":"p","c":"El Método 80/20 fitness demuestra que puedes mejorar tu físico sin renunciar a la vida que disfrutas. Con una base sólida el 80 % del tiempo, flexibilidad el 20 % y un plan que trabaje con tu cuerpo, los resultados llegan y se quedan. Empieza con un solo cambio esta semana: añade proteína a tu desayuno, agenda tus entrenamientos o duerme una hora más. Y si quieres acompañamiento profesional, estaré encantada de ayudarte."}]}],"wp":[{"slug":"entrenamiento-de-fuerza-para-principiantes","title":"Entrenamiento de fuerza para principiantes: guía completa para empezar en el gimnasio","description":"Guía de entrenamiento de fuerza para principiantes: ejercicios básicos, rutina de gimnasio de 3 días y progresión de cargas para ganar músculo con buena técnica.","date":"2026-09-25T09:00:00","html":"<p>Entrar por primera vez a la zona de pesas puede intimidar: máquinas por todas partes, barras, mancuernas y gente que parece saber exactamente qué hace. Si te suena familiar, tranquila: todo el mundo empezó sin saber. Esta guía de entrenamiento de fuerza para principiantes te explica qué ejercicios elegir, cómo organizar tu semana y cómo progresar sin lesionarte ni abandonar a las dos semanas. Al final tendrás una rutina de gimnasio para principiantes que puedes empezar esta misma semana.</p>\n<h2>Por qué el entrenamiento de fuerza es la mejor inversión en tu cuerpo</h2>\n<p>Levantar pesas no es solo cosa de quien busca «marcarse». El trabajo de fuerza construye y conserva músculo, mejora tu postura, fortalece huesos y articulaciones, y hace que las tareas diarias, como cargar la compra o subir escaleras, sean más fáciles. Además, es la mejor herramienta para cambiar tu composición corporal: más músculo y menos grasa, con ese físico firme y atlético que tanta gente busca.</p>\n<p>Las guías de la Organización Mundial de la Salud recomiendan que los adultos hagan actividades de fortalecimiento muscular al menos dos días por semana; puedes revisarlas en la <a href=\"https://www.who.int/news-room/fact-sheets/detail/physical-activity\" target=\"_blank\" rel=\"noopener noreferrer\">ficha de actividad física de la OMS</a>. Es decir, empezar con dos o tres sesiones semanales ya es una meta excelente, y todo lo que sumes después será una mejora sobre una base sólida.</p>\n<h2>Antes de empezar: lo que necesitas saber</h2>\n<h3>Técnica primero, peso después</h3>\n<p>El error más común de quien empieza es cargar demasiado peso demasiado pronto. Aprende cada movimiento con poca carga, controla la bajada y mantén la espalda neutra. Grabarte con el móvil o pedir una revisión de técnica te ahorra malos hábitos que después cuesta corregir.</p>\n<h3>Calentamiento y movilidad</h3>\n<p>Dedica cinco a diez minutos a subir la temperatura con una caminata suave o bicicleta y a movilizar cadera, hombros y tobillos. Después, haz una o dos series ligeras del primer ejercicio. Así llegas a las series de trabajo con las articulaciones preparadas y con mejor sensación en cada repetición.</p>\n<h3>Cuántos días entrenar</h3>\n<p>Para empezar, tres días no consecutivos son ideales: por ejemplo lunes, miércoles y viernes. Te dan tiempo de recuperar y suficiente frecuencia para mejorar. Si tu agenda está complicada, dos días bien hechos superan a cinco días a medias, porque la constancia importa más que el volumen.</p>\n<h2>Ejercicios básicos de fuerza que no pueden faltar</h2>\n<p>No necesitas cientos de ejercicios. Los movimientos básicos trabajan varios músculos a la vez y te dan el mejor resultado por minuto invertido:</p>\n<ul><li>Sentadilla (con copa, en máquina o con barra): piernas y glúteos.</li><li>Puente de glúteo o hip thrust: glúteos y parte posterior del muslo.</li><li>Peso muerto rumano: cadena posterior y glúteos.</li><li>Press de pecho con mancuernas o en máquina: pecho, hombros y tríceps.</li><li>Remo o jalón al pecho: espalda y bíceps.</li><li>Plancha: abdomen y estabilidad del tronco.</li></ul>\n<img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhgzIh0iMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzMzP/wAARCAOEA4QDASIAAhEBAxEB/8QAHAAAAQUBAQEAAAAAAAAAAAAABAABAgMFBgcI/8QATBAAAQMCBAQDBAYHBwMDBAEFAQACAwQRBRIhMQYTQVEiYXEUMoGhByNCUpGxFSQzYnLB0RY0Q2OCkuElRFOTovAmNbLxc4MXNlRF/8QAGgEBAQEBAQEBAAAAAAAAAAAAAAECAwQFBv/EACgRAQEAAgICAwADAQACAwEAAAABAhEDMRIhBDJBEyJRBRQjM0Jhcf/aAAwDAQACEQMRAD8A84OgPZQuegRMjLOe3s5Vlthsvn3t9HXpQQoPb5K57T0CrLCkSwO5muyqc3yRTmqpw0XSVihHg7WVD2ot4VLgtxzsDEKNtVa4KGVdIxYrtZJSIsolVjR s y unos 60 a 90 segundos de descanso entre series.</p>\n<h3>Día 1: tren inferior</h3>\n<ul><li>Sentadilla con copa</li><li>Peso muerto rumano con mancuernas</li><li>Zancadas caminando</li><li>Puente de glúteo</li></ul>\n<h3>Día 2: tren superior</h3>\n<ul><li>Press de pecho con mancuernas</li><li>Jalón al pecho</li><li>Press de hombros</li><li>Remo sentada en máquina</li></ul>\n<h3>Día 3: cuerpo completo</h3>\n<ul><li>Prensa de piernas</li><li>Remo con mancuerna</li><li>Hip thrust</li><li>Plancha, tres series de 30 segundos</li></ul>\n<p>Termina cada sesión con estiramientos suaves. Elige un peso con el que las últimas repeticiones sean exigentes, pero siempre con la técnica intacta. Si terminas sin ningún esfuerzo, sube la carga; si tu forma se rompe, bájala.</p>\n<h2>Progresión de cargas: el secreto que casi todos ignoran</h2>\n<p>Tu cuerpo solo se adapta si le pides algo un poco más difícil cada cierto tiempo. A eso se le llama progresión de cargas, y es el motor de cualquier plan de fuerza. No consiste en subir peso cada día, sino en mejorar de forma gradual. Puedes progresar de varias maneras:</p>\n<ul><li>Añadir repeticiones con el mismo peso hasta llegar al máximo del rango.</li><li>Subir una pequeña cantidad de peso cuando completas todas las series.</li><li>Mejorar la técnica o el control, por ejemplo bajando más lento.</li></ul>\n<p>Apunta tus entrenamientos en una libreta o en el móvil. Lo que no se mide se olvida, y ver tus números subir semana tras semana es una motivación enorme.</p>\n<h2>Cómo ganar músculo: nutrición y descanso</h2>\n<p>Para ganar músculo no basta con entrenar bien. Necesitas comer suficiente proteína, repartida en todas tus comidas, y energía adecuada para rendir en el gimnasio. Dormir entre siete y ocho horas ayuda a recuperar y a mantener bajo control el apetito y la motivación. Si además tu objetivo es perder grasa, un déficit moderado y una alimentación flexible funcionan mejor que las dietas extremas, tal como explico en el <a href=\"/blog/metodo-80-20-fitness\">Método 80/20 fitness</a>.</p>\n<h2>Cómo medir tu progreso más allá de la báscula</h2>\n<p>El peso corporal no cuenta toda la historia, sobre todo cuando ganas músculo mientras pierdes grasa. Mide tu avance con varias señales: las cargas que levantas, las repeticiones que logras, cómo te queda la ropa, fotos mensuales con la misma luz y tu energía a lo largo del día. Revisa estos datos cada cuatro semanas, no cada día, para evitar frustraciones innecesarias. Si todos los indicadores se estancan durante un mes, ajusta un solo elemento: más descanso, más proteína o una pequeña subida de carga. Cambiar una variable a la vez te permite saber qué funciona.</p>\n<h2>Errores comunes de quien empieza</h2>\n<ul><li>Cambiar de rutina cada semana en lugar de repetir y progresar.</li><li>Saltarse el calentamiento por falta de tiempo.</li><li>Hacer solo cardio por miedo a las pesas.</li><li>Compararse con personas que llevan años entrenando.</li><li>Entrenar sin descanso hasta acabar agotada y desmotivada.</li></ul>\n<p>Cometer alguno de estos errores es normal. Lo importante es detectarlos a tiempo y corregir el rumbo con calma.</p>\n<h2>Cuándo conviene un preparador físico online</h2>\n<p>Puedes empezar por tu cuenta con esta guía, pero un preparador físico online acelera el proceso: diseña el plan para tu nivel, corrige tu técnica a partir de videos, ajusta las cargas y te da un motivo para no faltar. Si sientes que te estancas o no sabes por dónde empezar, conoce cómo funciona el <a href=\"/#servicios\">coaching online 1:1</a> o envía tu <a href=\"/#aplicar\">aplicación</a>.</p>\n<h2>Preguntas frecuentes sobre el entrenamiento de fuerza</h2>\n<h3>¿Voy a ponerme «voluminosa» si levanto pesas?</h3>\n<p>No. Ganar mucho volumen muscular requiere años de entrenamiento específico y una alimentación muy planificada. Lo habitual es notar un cuerpo más firme, definido y fuerte.</p>\n<h3>¿Cuánto tarda en notarse el cambio?</h3>\n<p>La fuerza suele mejorar en las primeras semanas; los cambios visibles llegan después de dos o tres meses de constancia, según cada persona.</p>\n<h3>¿Puedo entrenar en casa?</h3>\n<p>Sí. Con mancuernas, bandas elásticas y tu peso corporal puedes seguir una buena rutina, siempre que apliques la progresión de cargas.</p>\n<h2>Conclusión</h2>\n<p>El entrenamiento de fuerza para principiantes no necesita ser complicado: elige ejercicios básicos, entrena tres días por semana, cuida tu técnica y progresa poco a poco. Con paciencia y constancia, tu cuerpo responderá. Empieza esta semana con una sola sesión y construye desde ahí. Recuerda que nadie levanta bien desde el primer día: cada entrenamiento es práctica, y la práctica es lo que te vuelve fuerte y segura dentro y fuera del gimnasio.</p>","cover":{"src":"/images/entrenamiento-fuerza.png","alt":"Mujer entrenando espalda en máquina de gimnasio, entrenamiento de fuerza para principiantes"}},{"slug":"alimentacion-flexible-comer-sin-culpa","title":"Alimentación flexible: cómo comer sin culpa y perder grasa sin dieta estricta","description":"Alimentación flexible paso a paso: arma tu plato, come fuera sin culpa y logra un déficit calórico moderado sin dietas estrictas ni alimentos prohibidos.","date":"2026-09-21T09:00:00","html":"<p>Muchas personas asocian «comer sano» con listas de alimentos prohibidos, básculas de cocina y culpa después de cada antojo. La alimentación flexible propone lo contrario: un plan de alimentación flexible donde ningún alimento está vetado, las decisiones se toman con criterio y el progreso no depende de la perfección. En esta guía verás cómo funciona, cómo armar tu plato, cómo comer fuera sin culpa y cómo lograr un déficit calórico moderado para perder grasa sin dieta estricta.</p>\n<h2>¿Qué es la alimentación flexible?</h2>\n<p>La alimentación flexible es un enfoque que combina alimentos nutritivos la mayor parte del tiempo con espacio para disfrutar comidas que te gustan. No se basa en eliminar grupos de alimentos, sino en decidir porciones y frecuencias. Es la aplicación práctica de la regla 80/20: el 80 % de tus comidas construye tu salud y tu físico, y el 20 % te permite vivir sin ansiedad.</p>\n<p>Su gran ventaja es la adherencia. El mejor plan de alimentación no es el más perfecto en el papel, sino el que puedes seguir durante meses sin sentir que estás en guerra con tu plato. Si quieres ver el enfoque completo, lee el artículo sobre el <a href=\"/blog/metodo-80-20-fitness\">Método 80/20 fitness</a>.</p>\n<h2>Por qué prohibir alimentos casi siempre sale mal</h2>\n<p>Cuando un alimento se convierte en «prohibido», gana poder: piensas más en él, lo deseas más y, cuando por fin lo comes, es fácil sentir que ya lo arruinaste todo y seguir comiendo sin control. Este ciclo de restricción y exceso desgasta tu motivación y tu relación con la comida. Además:</p>\n<ul><li>Las dietas muy estrictas son difíciles de sostener en la vida social real.</li><li>Generan culpa, que no ayuda a tomar mejores decisiones.</li><li>Suelen terminar en rebote cuando vuelves a comer «normal».</li></ul>\n<p>Si tienes antecedentes de trastornos de la conducta alimentaria o una condición médica, consulta primero con un profesional de la salud antes de cambiar tu alimentación.</p>\n<h2>Los cuatro pilares de un plan de alimentación flexible</h2>\n<h3>1. Proteína en cada comida</h3>\n<p>Incluir proteína en cada comida ayuda a saciarte, a conservar músculo y a mantener la energía. Pollo, pescado, huevos, yogur griego, legumbres, tofu o carne magra son buenas opciones. Usa la palma de tu mano como referencia sencilla de porción y ajústala con el tiempo según tu hambre y tu entrenamiento. Repartirla a lo largo del día suele ser más práctico que concentrarla en una sola comida.</p>\n<h3>2. Verduras y fibra</h3>\n<p>Las verduras aportan volumen, micronutrientes y fibra con pocas calorías. Intenta que ocupen aproximadamente la mitad de tu plato en las comidas principales. Si no te gustan crudas, prueba salteadas, al horno o en sopas; la variedad de colores es una buena guía visual.</p>\n<h3>3. Carbohidratos según tu actividad</h3>\n<p>Los carbohidratos no son enemigos: son el combustible de tus entrenamientos. Arroz, papa, avena, frutas y pan integral pueden convivir con tus objetivos. Come más en los días de entrenamiento intenso y algo menos en los días de descanso, sin necesidad de eliminarlos.</p>\n<h3>4. Grasas saludables</h3>\n<p>Aguacate, frutos secos, aceite de oliva y pescados grasos ayudan a la saciedad y al buen funcionamiento del cuerpo. Sirven en cantidades moderadas, porque son muy densas en energía y es fácil pasarse sin darte cuenta.</p>\n<h2>Déficit calórico moderado sin obsesión</h2>\n<p>Para perder grasa necesitas, en general, consumir algo menos de energía de la que gastas. La clave es que el déficit calórico sea moderado y sostenido, no agresivo. Un recorte muy fuerte provoca hambre, cansancio y pérdida de músculo, y casi siempre se abandona. Prefiere ajustes pequeños: porciones un poco más ajustadas, más proteína y verduras, menos bebidas con calorías y más pasos diarios.</p>\n<p>Controla tu progreso con varias señales a la vez: cómo te quedan las prendas, tu energía, tus marcas en el gimnasio y tu peso promedio semanal, en lugar de reaccionar a un solo dato del día. Para complementar la alimentación con fuerza, revisa la guía de <a href=\"/blog/entrenamiento-de-fuerza-para-principiantes\">entrenamiento de fuerza para principiantes</a>.</p>\n<h2>Cómo armar tu plato sin pesar la comida</h2>\n<p>Un método visual que puedes usar en casa o en restaurantes:</p>\n<ul><li>La mitad del plato, de verduras o ensalada.</li><li>Un cuarto del plato, de proteína magra.</li><li>Un cuarto del plato, de carbohidratos de calidad.</li><li>Un toque de grasa saludable, como aceite de oliva o aguacate.</li></ul>\n<img src=\"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBD l+M/UtP48f5ZHgwA78fTy832f//Z\" alt=\"Coach de FranFit en la cocina explicando cómo armar un plato con alimentación flexible\" />\n<p>Con la práctica, este plato se vuelve automático y no necesitas calculadora ni báscula para comer de forma equilibrada. Es una herramienta simple que te acompaña también cuando cocinas para más personas.</p>\n<h2>Comer fuera sin culpa: estrategias prácticas</h2>\n<ul><li>Mira el menú con antelación y decide qué te apetece de verdad.</li><li>Empieza por una proteína y algo de verdura para llegar con menos hambre al capricho.</li><li>Elige un solo capricho y disfrútalo despacio, sin distraerte.</li><li>No llegues con demasiada hambre después de saltarte comidas.</li><li>Al día siguiente, vuelve a tu rutina sin compensar con castigos.</li></ul>\n<p>Recuerda que una comida no define tu progreso. Lo que cuenta es la tendencia de las semanas, y por eso comer fuera sin culpa es parte del plan, no una excepción.</p>\n<h2>Un día de ejemplo con alimentación flexible</h2>\n<ul><li>Desayuno: yogur griego con fruta, avena y frutos secos.</li><li>Almuerzo: pollo con arroz y verduras salteadas.</li><li>Merienda: fruta y un puñado de almendras.</li><li>Cena: pescado al horno con papa y ensalada, y algo dulce si te apetece.</li></ul>\n<h2>Hidratación y bebidas: un detalle que suma</h2>\n<p>Beber suficiente agua ayuda a distinguir la sed del hambre y mejora tu rendimiento en los entrenamientos. Las bebidas azucaradas, los jugos y el alcohol aportan calorías que se olvidan con facilidad, así que conviene tratarlos como parte de tu 20 % y no como un acompañamiento diario. Prefiere agua, infusiones y café sin exceso de azúcar. Es un cambio pequeño que, sostenido durante meses, reduce calorías «invisibles» sin quitarte comida.</p>\n<h2>Cómo empezar esta semana</h2>\n<ul><li>Añade una fuente de proteína a tu desayuno.</li><li>Cocina en casa dos comidas más de las habituales.</li><li>Usa el método del plato en tu comida principal.</li><li>Elige tu comida libre de la semana y disfrútala sin culpa.</li><li>Camina un poco más cada día y duerme lo suficiente.</li></ul>\n<p>Elige solo dos de estas acciones para las primeras dos semanas y añade otras cuando las primeras sean automáticas. Avanzar por etapas evita la saturación y aumenta las probabilidades de que el cambio se quede contigo.</p>\n<h2>Errores frecuentes al empezar</h2>\n<ul><li>Recortar demasiado las calorías desde el primer día.</li><li>Comer muy poca proteína.</li><li>Saltarse comidas para «guardar» calorías para el fin de semana.</li><li>Compensar cada exceso con ayunos o cardio extra.</li></ul>\n<h2>Preguntas frecuentes sobre alimentación flexible</h2>\n<h3>¿Puedo perder grasa comiendo pizza o dulces?</h3>\n<p>Sí, si el conjunto de tu semana está en orden. Ningún alimento por sí solo determina tu resultado; lo que importa es la constancia y las porciones.</p>\n<h3>¿Tengo que contar calorías?</h3>\n<p>No es obligatorio. Puedes empezar con el método del plato y usar el conteo solo como herramienta temporal si lo necesitas.</p>\n<h3>¿Cuánto tarda en notarse?</h3>\n<p>Depende de cada persona, pero con constancia suele notarse en semanas la energía y, en unos meses, los cambios corporales.</p>\n<h2>Conclusión</h2>\n<p>La alimentación flexible te permite mejorar tu físico sin renunciar al placer de comer. Prioriza proteína, verduras y carbohidratos según tu actividad, mantén un déficit calórico moderado y disfruta tu 20 %. Si quieres que te acompañe en el proceso, aplica al <a href=\"/#aplicar\">coaching online</a> y armamos un plan a tu medida. Comer bien no debería sentirse como un castigo, sino como una forma de cuidarte y disfrutar de tu vida a la vez.</p>","cover":{"src":"/images/playa.jpg","alt":"Mujer saliendo del mar en la playa, alimentación flexible y estilo de vida equilibrado"}}],"img":{"gym":"data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAgGBgcGBQgHBwcJCQgKDBUODAsLDBkSEw8VHhsgHx4bHR0hJTApISMtJB0dKjkqLTEzNjY2ICg7Pzo0PjA1NjP/2wBDAQkJCQwLDBgODhg <script>

const fix=h=>h.replace(/^\/#/,'#/').replace(/^\/blog/,'#/blog');
const inline=t=>esc(t).replace(/\[([^\]]+)\]\(([^)]+)\)/g,(m,l,h)=>h.startsWith('http')?`<a href="${h}" target="_blank" rel="noopener noreferrer" class="${A}">${l}</a>`:`<a href="${fix(h)}" class="${A}">${l}</a>`);
const date=d=>new Date(d).toLocaleDateString('es-ES',{dateStyle:'long'});

const all=[...D.posts,...D.wp];
const H2='font-display text-3xl font-semibold text-white sm:text-4xl';
const SEC='mx-auto max-w-6xl px-5 py-20 sm:py-28';

const pillars=[['apple','Nutrición balanceada','Proteína, verduras y carbohidratos en porciones que puedes sostener. Sin alimentos prohibidos ni culpa.'],['dumbbell','Entrenamiento de fuerza','Sesiones planificadas con progresión de cargas para construir músculo, postura y confianza.'],['moon','Descanso y recuperación','Sueño, pausas y manejo del estrés. Sin recuperación no hay progreso que dure.']];
const services=[['clipboard-check','Programa 100 % personalizado','Plan de entrenamiento y guía nutricional flexible según tu objetivo, horario y equipamiento.'],['calendar-check','Revisiones semanales','Analizamos tu progreso cada semana y ajustamos el plan para que sigas avanzando.'],['message-circle','Soporte directo','Resuelve dudas de técnica, comida o motivación sin esperar a la siguiente revisión.']];

function home(){const f=D.posts[0];return `
<section class="${SEC} grid items-center gap-12 md:grid-cols-2"><div>
<h1 class="font-display text-5xl font-semibold leading-[1.05] text-white sm:text-6xl">Trabaja con tu cuerpo, no en su contra.</h1>
<p class="mt-6 max-w-lg text-lg leading-relaxed text-mute">Coaching online 1:1 para entrenar fuerte, comer sin restricciones absurdas y construir un físico que puedas mantener toda la vida.</p>
<a href="#/aplicar" class="${BTN} mt-9 inline-block px-8 py-4">Aplica al Coaching</a></div>
<img src="${D.img.gym}" alt="Selfie en el espejo del gimnasio con ropa deportiva, entrenamiento de fuerza con FranFit" class="mx-auto aspect-square w-full max-w-md rounded-3xl border border-line object-cover"></section>
<section id="sobre-mi" class="border-y border-line bg-surface"><div class="${SEC} grid items-center gap-12 md:grid-cols-2">
<img src="${D.img.beach}" alt="Coach de FranFit saliendo del mar en la playa, estilo de vida activo y equilibrado" loading="lazy" class="mx-auto aspect-[3/4] w-full max-w-sm rounded-3xl object-cover">
<div><h2 class="${H2}">Sobre mí</h2><p class="mt-5 flex items-center gap-2 text-sm text-sand">${ic('map-pin','',16)} Con base en Miami, coaching para todo el mundo</p>
<p class="mt-5 leading-relaxed text-mute">Pasé años peleando con mi cuerpo: dietas estrictas, entrenos de castigo y la sensación de nunca ser suficiente. Cuando dejé de pelear y empecé a trabajar con él, todo cambió: más fuerza, más energía y una relación en paz con la comida.</p>
<p class="mt-4 leading-relaxed text-mute">Hoy vivo en Miami y ayudo a personas a lograrlo con un enfoque sin extremos: entrenar con intención, comer con criterio y disfrutar la vida sin pedir permiso.</p></div></div></section>
<section id="filosofia" class="${SEC}"><h2 class="${H2}">80/20 living</h2>
<p class="mt-4 max-w-2xl text-mute">El 80 % del tiempo sostienes hábitos que te acercan a tu meta. El 20 % restante es flexibilidad para disfrutar. Así el progreso deja de ser un castigo y se vuelve sostenible.</p>
<div class="mt-12 grid gap-6 md:grid-cols-3">${pillars.map(p=>`<article class="rounded-3xl border border-line bg-surface p-8">${ic(p[0],'text-sand',28)}<h3 class="mt-5 font-display text-xl font-semibold text-white">${p[1]}</h3><p class="mt-3 leading-relaxed text-mute">${p[2]}</p></article>`).join('')}</div></section>

<img src="${im(f.cover.src)}" alt="${f.cover.alt}" loading="lazy" class="h-full min-h-64 w-full object-cover object-top">
<div class="p-8 sm:p-10"><p class="text-sm text-sand">Guía completa · +1.200 palabras · ${f.readingTime}</p><h3 class="mt-3 font-display text-2xl font-semibold text-white">${f.title}</h3><p class="mt-4 leading-relaxed text-mute">${f.description}</p><span class="mt-6 inline-block font-semibold text-sand group-hover:underline">Leer el artículo</span></div></a></section>
<section id="aplicar" class="border-t border-line bg-surface"><div class="mx-auto max-w-xl px-5 py-20 sm:py-28"><h2 class="${H2} text-center">Aplica al Coaching</h2>
<p class="mb-10 mt-4 text-center text-mute">Cuéntame tu objetivo y tu nivel. Reviso cada aplicación para confirmar que puedo ayudarte.</p>
<form id="lead" class="space-y-5 rounded-3xl border border-line bg-surface p-6 sm:p-8">
<div><label for="nombre" class="mb-2 block text-sm text-mute">Nombre</label><input id="nombre" required autocomplete="name" class="${fld}" placeholder="Tu nombre"></div>
<div><label for="email" class="mb-2 block text-sm text-mute">Email</label><input id="email" type="email" required autocomplete="email" class="${fld}" placeholder="tu@email.com"></div>
${sel('objetivo','Objetivo principal',['Perder grasa','Ganar músculo y fuerza','Recomposición corporal','Mejorar mis hábitos'])}
${sel('nivel','Nivel de entrenamiento',['Principiante','Intermedio','Avanzado'])}
<button type="submit" class="${BTN} w-full py-3.5">Enviar aplicación</button></form></div></section>`}

function blogList(){return `<div class="mx-auto max-w-4xl px-5 py-16"><h1 class="font-display text-4xl font-semibold text-white sm:text-5xl">Blog</h1>
<p class="mt-4 text-mute">Fitness sostenible, sin extremos.</p><p class="mt-2 text-sm text-sand">Modo demo: las entradas de WordPress son simuladas.</p>
<ul class="mt-12 space-y-8">${all.map(p=>`<li><article class="grid overflow-hidden rounded-3xl border border-line bg-surface sm:grid-cols-[240px_1fr]">
<img src="${im(p.cover.src)}" alt="${p.cover.alt}" loading="lazy" class="h-full min-h-48 w-full object-cover object-top">
<div class="p-6"><time datetime="${p.date}" class="text-sm text-sand">${date(p.date)}</time><h2 class="mt-2 font-display text-2xl font-semibold text-white"><a href="#/blog/${p.slug}" class="hover:text-sand">${p.title}</a></h2><p class="mt-3 text-mute">${p.description}</p></div></article></li>`).join('')}</ul></div>`}

const WPB='[&_h2]:mb-4 [&_h2]:mt-12 [&_h2]:font-display [&_h2]:text-3xl [&_h2]:font-semibold [&_h2]:text-white [&_h3]:mb-3 [&_h3]:mt-8 [&_h3]:font-display [&_h3]:text-xl [&_h3]:text-white [&_img]:my-8 [&_img]:w-full [&_img]:rounded-2xl [&_img]:border [&_img]:border-line [&_p]:mb-5 [&_p]:text-lg [&_p]:leading-8 [&_p]:text-neutral-300 [&_ul]:mb-6 [&_ul]:list-disc [&_ul]:space-y-2 [&_ul]:pl-6 [&_ul]:text-lg [&_ul]:leading-8 [&_ul]:text-neutral-300 [&_a]:text-sand [&_a]:underline';
const block=b=>b.t==='h2'?`<h2 class="mb-4 mt-14 font-display text-3xl font-semibold text-white">${esc(b.c)}</h2>`
:b.t==='h3'?`<h3 class="mb-3 mt-8 font-display text-xl font-semibold text-white">${esc(b.c)}</h3>`
:b.t==='p'?`<p class="mb-5 text-lg leading-8 text-neutral-300">${inline(b.c)}</p>`
:b.t==='ul'?`<ul class="mb-6 list-disc space-y-2 pl-6 text-lg leading-8 text-neutral-300 marker:text-sand">${b.c.map(l=>`<li>${inline(l)}</li>`).join('')}</ul>`
:`<figure class="my-10"><img src="${im(b.src)}" alt="${b.alt}" loading="lazy" class="aspect-[4/3] w-full rounded-2xl border border-line object-cover object-top"><figcaption class="mt-3 text-center text-sm text-mute">${b.cap||''}</figcaption></figure>`;

function article(slug){const p=all.find(x=>x.slug===slug);if(!p)return `<div class="px-5 py-32 text-center"><h1 class="font-display text-3xl text-white">Artículo no encontrado</h1><a href="#/blog" class="${A} mt-4 inline-block">Volver al blog</a></div>`;
const body=p.blocks?`<section class="mt-10">${p.blocks.map(block).join('')}</section>`:`<div class="mt-10 ${WPB}">${p.html.replace(/href="\/#/g,'href="#/').replace(/href="\/blog\//g,'href="#/blog/')}</div>`;
return `<article class="mx-auto max-w-3xl px-5 py-14"><nav aria-label="Migas de pan" class="mb-6 text-sm text-mute"><a href="#/blog" class="hover:text-white">Blog</a></nav>
<header><h1 class="font-display text-4xl font-semibold leading-tight text-white sm:text-5xl">${p.title}</h1>
<p class="mt-4 text-sm text-mute"><time datetime="${p.date}">${date(p.date)}</time>${p.readingTime?` · ${p.readingTime} de lectura`:''}</p>
<figure class="mt-8"><img src="${im(p.cover.src)}" alt="${p.cover.alt}" class="aspect-[16/10] w-full rounded-2xl border border-line object-cover object-top"></figure></header>${body}
<footer class="mt-14 rounded-2xl border border-line bg-surface p-8 text-center"><p class="font-display text-2xl text-white">¿Lista para trabajar con tu cuerpo?</p><a href="#/aplicar" class="${BTN} mt-5 inline-block">Aplica al Coaching</a></footer></article>`}

function seo(t,d){document.title=t;document.querySelector('meta[name=description]').content=d;document.querySelector('meta[property="og:title"]').content=t}
function route(){
  const [a,b]=location.hash.replace(/^#\/?/,'').split('/');let m,t='FranFit | Coaching online fitness 1:1',d='Trabaja con tu cuerpo, no en su contra. Coaching online fitness 1:1 con el enfoque 80/20 living.';
  if(a==='blog'&&b){const p=all.find(x=>x.slug===b);m=article(b);if(p){t=p.title+' | FranFit';d=p.description}}
  else if(a==='blog'){m=blogList();t='Blog de fitness sostenible | FranFit';d='Artículos sobre coaching online fitness, fuerza y nutrición flexible con el enfoque 80/20.'}
  else m=home();
  document.getElementById('app').innerHTML=NAV+`<main>${m}</main>`+FOOT;seo(t,d);
  if(window.lucide)lucide.createIcons();
  const f=document.getElementById('lead');if(f)f.onsubmit=e=>{e.preventDefault();f.outerHTML=`<p role="status" class="rounded-2xl border border-sand/40 bg-surface p-8 text-center text-lg text-white">Recibimos tu aplicación. Revisaré tus respuestas y te escribiré al correo que dejaste.</p>`};
  if(a&&a!=='blog'){const el=document.getElementById(a);el?el.scrollIntoView():scrollTo(0,0)}else scrollTo(0,0);
}
addEventListener('hashchange',route);addEventListener('load',route);route();
</script>
</body>
</html>
